<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現在時刻・ストップウォッチとテキスト表示・動画切り替え</title>
  <style>
    /* ==========================================
       完全自己完結型 CSSスタイルシート（外部通信なし）
       ========================================== */
    :root {
      --font-main: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      --font-clock: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      position: relative;
      overflow-x: hidden;
    }

    button {
      cursor: pointer;
      border: none;
      font-family: inherit;
      color: inherit;
      background: none;
      transition: all 0.15s ease;
    }

    button:active {
      transform: scale(0.95);
    }

    .hidden {
      display: none !important;
    }

    /* 右上のコントロール（設定歯車・フルスクリーン） */
    .top-controls {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 20;
      display: flex;
      gap: 0.5rem;
    }

    .control-btn {
      padding: 0.5rem 0.75rem;
      background-color: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.6);
      border-radius: 0.75rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 0.375rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .control-btn:hover {
      background-color: #334155;
      color: #ffffff;
    }

    /* 設定モーダル（歯車メニュー） */
    .settings-modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .settings-box {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 1.25rem;
      padding: 1.5rem;
      width: 100%;
      max-width: 24rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .settings-title {
      font-size: 1.125rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .setting-group {
      margin-bottom: 1rem;
      text-align: left;
    }

    .setting-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 0.375rem;
    }

    .setting-select {
      width: 100%;
      padding: 0.5rem 0.75rem;
      background-color: #0f172a;
      color: #ffffff;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      outline: none;
    }

    .setting-select:focus {
      border-color: #6366f1;
    }

    /* 動画オーバーレイ */
    .video-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background-color: rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .fg-video {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 1rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(51, 65, 85, 0.5);
      background-color: #000000;
    }

    .video-controls {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      background-color: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      padding: 0.75rem 1.5rem;
      border-radius: 1rem;
      border: 1px solid #334155;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    /* メインレイアウト */
    .main-container {
      width: 100%;
      max-width: 48rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 10;
      gap: 1.5rem;
      margin: auto 0;
    }

    .date-display {
      color: #94a3b8;
      font-size: 1.125rem;
      font-weight: 300;
      letter-spacing: 0.025em;
    }

    /* 時計・ストップウォッチパネル */
    .clock-panel {
      background-color: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.5);
      border-radius: 1.5rem;
      padding: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .mode-tabs {
      display: inline-flex;
      background-color: rgba(15, 23, 42, 0.8);
      padding: 0.25rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(51, 65, 85, 0.6);
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      padding: 0.375rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #94a3b8;
    }

    .tab-btn:hover {
      color: #ffffff;
    }

    .tab-btn.active {
      background-color: #4f46e5;
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .clock-view {
      width: 100%;
      padding: 0.5rem 0;
    }

    .clock-text {
      font-family: var(--font-clock);
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #ffffff;
      line-height: 1.1;
    }

    .stopwatch-view {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stopwatch-text {
      font-family: var(--font-clock);
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #ffffff;
      margin: 0.5rem 0;
      line-height: 1.1;
    }

    .stopwatch-ms {
      font-size: 1.5rem;
      color: #818cf8;
    }

    .sw-controls {
      margin-top: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
    }

    /* 汎用ボタンカラー */
    .btn-primary {
      padding: 0.625rem 1.5rem;
      background-color: #059669;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 700;
      min-width: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .btn-primary:hover { background-color: #10b981; }

    .btn-warning {
      background-color: #d97706;
    }
    .btn-warning:hover { background-color: #f59e0b; }

    .btn-secondary {
      padding: 0.625rem 1.25rem;
      background-color: #334155;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .btn-secondary:hover { background-color: #475569; }

    .btn-indigo {
      padding: 0.5rem 1.25rem;
      background-color: #4f46e5;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 700;
      min-width: 115px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
    }
    .btn-indigo:hover { background-color: #6366f1; }

    .btn-danger {
      padding: 0.5rem 1rem;
      background-color: #e11d48;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }
    .btn-danger:hover { background-color: #f43f5e; }

    /* メモエリア */
    .memo-panel {
      width: 100%;
      background-color: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.4);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      text-align: left;
    }

    .memo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.05em;
    }

    .editor-tools {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tool-btn {
      padding: 0.25rem 0.625rem;
      background-color: #334155;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .tool-btn:hover { background-color: #475569; }

    .color-picker-wrap {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      background-color: #334155;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
    }

    .color-input {
      width: 1.25rem;
      height: 1.25rem;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .memo-editor {
      width: 100%;
      min-height: 90px;
      background-color: rgba(15, 23, 42, 0.6);
      color: #f1f5f9;
      font-size: 1rem;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 0.75rem;
      outline: none;
      overflow-y: auto;
    }

    .memo-editor:focus {
      box-shadow: 0 0 0 2px #6366f1;
    }

    [contenteditable]:empty:before {
      content: attr(placeholder);
      color: #64748b;
      pointer-events: none;
      display: block;
    }

    /* 曜日別動画エリア */
    .video-panel {
      width: 100%;
      background-color: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.3);
      border-radius: 1rem;
      padding: 1rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .video-panel .section-label {
      margin-bottom: 0.75rem;
    }

    .day-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
    }

    .day-btn {
      padding: 0.5rem 1rem;
      background-color: rgba(51, 65, 85, 0.8);
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .day-btn:hover, .day-btn:focus {
      background-color: #4f46e5;
    }

    /* レスポンシブ調整 */
    @media (min-width: 640px) {
      .clock-text { font-size: 4.5rem; }
      .stopwatch-text { font-size: 3.75rem; }
      .stopwatch-ms { font-size: 2.25rem; }
    }

    @media (min-width: 768px) {
      .date-display { font-size: 1.5rem; }
      .clock-panel { padding: 2.5rem; }
      .tab-btn { font-size: 0.875rem; }
      .clock-text { font-size: 6rem; }
      .stopwatch-text { font-size: 4.5rem; }
      .btn-primary, .btn-secondary { font-size: 1rem; }
      .memo-editor { font-size: 1.125rem; }
      .day-buttons { gap: 0.75rem; }
      .video-controls { gap: 1rem; }
    }
  </style>
</head>
<body>

  <!-- 右上のボタン群（歯車設定・フルスクリーン） -->
  <div class="top-controls">
    <button onclick="openSettings()" class="control-btn" title="フォント設定">
      <span>⚙️</span> 設定
    </button>
    <button onclick="toggleFullScreen()" class="control-btn" title="フルスクリーン切り替え">
      <span>⛶</span> フルスクリーン
    </button>
  </div>

  <!-- 設定モーダル（歯車からフォント変更） -->
  <div id="settings-modal" class="settings-modal hidden" onclick="closeSettingsOnBg(event)">
    <div class="settings-box">
      <div class="settings-title">
        <span>⚙️ フォント設定</span>
        <button onclick="closeSettings()" style="color: #94a3b8; font-size: 1.25rem;">✖</button>
      </div>
      
      <div class="setting-group">
        <label class="setting-label" for="clock-font-select">時間・ストップウォッチのフォント</label>
        <select id="clock-font-select" class="setting-select" onchange="changeClockFont(this.value)">
          <option value='ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace'>等幅デジタル風（デフォルト）</option>
          <option value='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif'>ゴシック体（すっきり）</option>
          <option value='"Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif'>明朝体（クラシック）</option>
          <option value='"Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "HG丸ｺﾞｼｯｸM-PRO", sans-serif'>丸ゴシック体（やわらかい）</option>
        </select>
      </div>

      <div class="setting-group">
        <label class="setting-label" for="main-font-select">全体のメインフォント（日付・メモなど）</label>
        <select id="main-font-select" class="setting-select" onchange="changeMainFont(this.value)">
          <option value='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif'>ゴシック体（デフォルト）</option>
          <option value='"Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif'>明朝体（落ち着いた雰囲気）</option>
          <option value='"Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "HG丸ｺﾞｼｯｸM-PRO", sans-serif'>丸ゴシック体（やさしい雰囲気）</option>
          <option value='ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace'>等幅フォント（システム風）</option>
        </select>
      </div>

      <div style="margin-top: 1.5rem; text-align: right;">
        <button onclick="closeSettings()" class="btn-indigo" style="display: inline-flex;">完了</button>
      </div>
    </div>
  </div>

  <!-- 最前面の動画オーバーレイエリア（初期状態は非表示） -->
  <div id="video-overlay" class="video-overlay hidden">
    <video id="fg-video" playsinline class="fg-video">
      <source id="video-source" src="" type="video/mp4">
    </video>

    <div class="video-controls">
      <button onclick="rewindVideo()" class="btn-secondary">
        <span>⏪</span> 10秒戻す
      </button>
      <button id="play-pause-btn" onclick="togglePlayPause()" class="btn-indigo">
        <span>▶️</span> 再生
      </button>
      <button onclick="closeVideo()" class="btn-danger">
        <span>✖️</span> 終了
      </button>
    </div>
  </div>

  <!-- メインコンテンツ領域 -->
  <main class="main-container">

    <!-- 日付表示 -->
    <div id="date" class="date-display">
      ----年--月--日 (ー)
    </div>

    <!-- 時刻・ストップウォッチ切り替え表示エリア -->
    <div class="clock-panel">
      
      <!-- モード切替タブ -->
      <div class="mode-tabs">
        <button id="tab-clock" onclick="switchMode('clock')" class="tab-btn active">
          🕒 現在時刻
        </button>
        <button id="tab-stopwatch" onclick="switchMode('stopwatch')" class="tab-btn">
          ⏱️ ストップウォッチ
        </button>
      </div>

      <!-- ① 現在時刻ビュー -->
      <div id="clock-view" class="clock-view">
        <div id="clock" class="clock-text">
          00:00:00
        </div>
      </div>

      <!-- ② ストップウォッチビュー -->
      <div id="stopwatch-view" class="stopwatch-view hidden">
        <div id="stopwatch-display" class="stopwatch-text">
          00:00:00<span class="stopwatch-ms">.00</span>
        </div>
        
        <div class="sw-controls">
          <button id="sw-start-btn" onclick="toggleStopwatch()" class="btn-primary">
            <span>▶️</span> スタート
          </button>
          <button onclick="resetStopwatch()" class="btn-secondary">
            <span>🔄</span> リセット
          </button>
        </div>
      </div>

    </div>

    <!-- 下部の入力可能エリア -->
    <div class="memo-panel">
      <div class="memo-header">
        <label class="section-label">
          メッセージ / メモ (文字の太さや色を変更できます)
        </label>
        <div class="editor-tools">
          <button type="button" onclick="formatText('bold')" class="tool-btn" title="太字にする">B</button>
          <div class="color-picker-wrap">
            <span>色:</span>
            <input type="color" id="text-color-picker" onchange="changeTextColor(this.value)" value="#ffffff" class="color-input" title="文字色を変更">
          </div>
        </div>
      </div>
      <div id="user-text" contenteditable="true" class="memo-editor" placeholder="ここにテキストを入力してください..."></div>
    </div>

    <!-- 曜日選択ボタンエリア -->
    <div class="video-panel">
      <p class="section-label">曜日別動画再生（最前面表示）</p>
      <div class="day-buttons">
        <button onclick="openVideo('monday')" class="day-btn">月曜日</button>
        <button onclick="openVideo('tuesday')" class="day-btn">火曜日</button>
        <button onclick="openVideo('wednesday')" class="day-btn">水曜日</button>
        <button onclick="openVideo('thursday')" class="day-btn">木曜日</button>
        <button onclick="openVideo('friday')" class="day-btn">金曜日</button>
      </div>
    </div>

  </main>

  <script>
    // ==========================================
    // 1. 現在時刻の更新処理
    // ==========================================
    function updateClock() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
      const day = dayNames[now.getDay()];

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('date').textContent = `${year}年${month}月${date}日 (${day})`;
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
    }

    setInterval(updateClock, 1000);
    updateClock();

    // ==========================================
    // 2. フォント設定（歯車メニュー）
    // ==========================================
    function openSettings() {
      document.getElementById('settings-modal').classList.remove('hidden');
    }

    function closeSettings() {
      document.getElementById('settings-modal').classList.add('hidden');
    }

    function closeSettingsOnBg(event) {
      if (event.target.id === 'settings-modal') {
        closeSettings();
      }
    }

    function changeClockFont(fontFamily) {
      document.documentElement.style.setProperty('--font-clock', fontFamily);
    }

    function changeMainFont(fontFamily) {
      document.documentElement.style.setProperty('--font-main', fontFamily);
    }

    // ==========================================
    // 3. 時計 / ストップウォッチのモード切替
    // ==========================================
    function switchMode(mode) {
      const clockView = document.getElementById('clock-view');
      const swView = document.getElementById('stopwatch-view');
      const tabClock = document.getElementById('tab-clock');
      const tabSw = document.getElementById('tab-stopwatch');

      if (mode === 'clock') {
        clockView.classList.remove('hidden');
        swView.classList.add('hidden');
        tabClock.classList.add('active');
        tabSw.classList.remove('active');
      } else {
        clockView.classList.add('hidden');
        swView.classList.remove('hidden');
        tabSw.classList.add('active');
        tabClock.classList.remove('active');
      }
    }

    // ==========================================
    // 4. ストップウォッチ機能
    // ==========================================
    let swInterval = null;
    let swStartTime = 0;
    let swElapsedTime = 0;
    let swRunning = false;

    function formatStopwatch(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
      const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const seconds = String(totalSeconds % 60).padStart(2, '0');
      const centiseconds = String(Math.floor((ms % 1000) / 10)).padStart(2, '0');

      return `${hours}:${minutes}:${seconds}<span class="stopwatch-ms">.${centiseconds}</span>`;
    }

    function updateStopwatchDisplay() {
      const currentElapsed = swRunning ? (Date.now() - swStartTime + swElapsedTime) : swElapsedTime;
      document.getElementById('stopwatch-display').innerHTML = formatStopwatch(currentElapsed);
    }

    function toggleStopwatch() {
      const startBtn = document.getElementById('sw-start-btn');

      if (!swRunning) {
        swRunning = true;
        swStartTime = Date.now();
        swInterval = setInterval(updateStopwatchDisplay, 10);
        startBtn.innerHTML = '<span>⏸️</span> ストップ';
        startBtn.classList.add('btn-warning');
      } else {
        swRunning = false;
        clearInterval(swInterval);
        swElapsedTime += Date.now() - swStartTime;
        updateStopwatchDisplay();
        startBtn.innerHTML = '<span>▶️</span> 再開';
        startBtn.classList.remove('btn-warning');
      }
    }

    function resetStopwatch() {
      swRunning = false;
      clearInterval(swInterval);
      swElapsedTime = 0;
      swStartTime = 0;
      updateStopwatchDisplay();

      const startBtn = document.getElementById('sw-start-btn');
      startBtn.innerHTML = '<span>▶️</span> スタート';
      startBtn.classList.remove('btn-warning');
    }

    // ==========================================
    // 5. フルスクリーン・テキスト編集・動画オーバーレイ処理
    // ==========================================
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log("フルスクリーンエラー:", err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    function formatText(command) {
      document.execCommand(command, false, null);
      document.getElementById('user-text').focus();
    }

    function changeTextColor(color) {
      document.execCommand('foreColor', false, color);
      document.getElementById('user-text').focus();
    }

    const videoMap = {
      monday: 'monday.mp4',
      tuesday: 'tuesday.mp4',
      wednesday: 'wednesday.mp4',
      thursday: 'thursday.mp4',
      friday: 'friday.mp4'
    };

    const overlay = document.getElementById('video-overlay');
    const video = document.getElementById('fg-video');
    const source = document.getElementById('video-source');
    const playPauseBtn = document.getElementById('play-pause-btn');

    function openVideo(day) {
      const videoUrl = videoMap[day];
      if (!videoUrl) return;

      source.src = videoUrl;
      video.load();

      overlay.classList.remove('hidden');

      video.pause();
      updatePlayPauseButton(false);
    }

    function togglePlayPause() {
      if (video.paused || video.ended) {
        video.play().then(() => {
          updatePlayPauseButton(true);
        }).catch(err => {
          console.log("再生エラー:", err);
        });
      } else {
        video.pause();
        updatePlayPauseButton(false);
      }
    }

    function updatePlayPauseButton(isPlaying) {
      if (isPlaying) {
        playPauseBtn.innerHTML = '<span>⏸️</span> 一時停止';
      } else {
        playPauseBtn.innerHTML = '<span>▶️</span> 再生';
      }
    }

    function rewindVideo() {
      video.currentTime = Math.max(0, video.currentTime - 10);
    }

    function closeVideo() {
      video.pause();
      video.currentTime = 0;
      overlay.classList.add('hidden');
    }

    video.addEventListener('ended', () => {
      updatePlayPauseButton(false);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (!overlay.classList.contains('hidden')) {
          closeVideo();
        }
        if (!document.getElementById('settings-modal').classList.contains('hidden')) {
          closeSettings();
        }
      }
    });
  </script>
</body>
</html>
